<main class="section">
    <p class="eyebrow">STAY ORGANIZED</p>
    <h1>My Academic Planner</h1>

    <p>
        Organize your academic activities by adding tasks,
        marking completed tasks and deleting tasks.
    </p>

    <section class="card">
        <h2>Add a New Task</h2>

        <form id="taskForm">
            <label for="taskInput">Enter academic task:</label>

            <input
                type="text"
                id="taskInput"
                placeholder="e.g. Study HTML and CSS"
                required
            >

            <button class="button" type="submit">Add Task</button>
        </form>

        <h2>My Tasks</h2>

        <ul id="taskList"></ul>
    </section>
</main>
